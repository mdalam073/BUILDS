name: Build crDroid 16 (Tissot)

on:
  workflow_dispatch:   # Run manually
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-20.04
    timeout-minutes: 360  # 6 hours

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
          git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
          lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev \
          libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
          xsltproc zip zlib1g-dev openjdk-8-jdk repo wget python-is-python3 jq

    - name: Initialize crDroid repo
      run: |
        mkdir android && cd android
        repo init -u https://github.com/crdroidandroid/android.git -b 16.0
        repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

    - name: Clone device, vendor, kernel trees
      run: |
        cd android
        git clone https://github.com/mdalam073/device_xiaomi_tissot_e -b bka device/xiaomi/tissot
        git clone https://github.com/mdalam073/device_xiaomi_msm8953-common_e -b bka device/xiaomi/msm8953-common
        git clone https://github.com/mdalam073/vendor_xiaomi_tissot -b bka vendor/xiaomi/tissot
        git clone https://github.com/mdalam073/vendor_xiaomi_msm8953-common_e -b bka vendor/xiaomi/msm8953-common
        git clone https://github.com/mdalam073/kernel_xiaomi_tissot -b bka kernel/xiaomi/msm8953
        git clone https://github.com/crdroidandroid/android_hardware_xiaomi hardware/xiaomi
        git clone https://github.com/LineageOS/android_hardware_sony_timekeep -b lineage-22.2 hardware/sony/timekeep
    - name: Set up ccache
      run: |
        export USE_CCACHE=1
        export CCACHE_EXEC=$(which ccache)
        ccache -M 5G

    - name: Start crDroid build
      run: |
        cd android
        source build/envsetup.sh
        brunch tissot

    - name: Upload ROM to PixelDrain
      run: |
        cd android/out/target/product/tissot
        ROM_ZIP=$(ls *.zip | head -n 1)
        echo "Uploading $ROM_ZIP to PixelDrain..."
        UPLOAD_RESPONSE=$(curl -H "Authorization: ${{ secrets.PIXELDRAIN_API_KEY }}" \
                          -F "file=@$ROM_ZIP" \
                          https://pixeldrain.com/api/file)
        echo "Upload response: $UPLOAD_RESPONSE"
        echo "PixelDrain link:"
        echo "https://pixeldrain.com/u/$(echo $UPLOAD_RESPONSE | jq -r .id)"